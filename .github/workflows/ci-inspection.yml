name: Test reviewable release continuity without activation
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
jobs:
  validate:
    if: vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: a3e138ff59679473171d5baa47725ff6c8c8c878
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: candidate
      - run: mkdir -p .ci-results && node --test --test-isolation=none --test-reporter=tap scripts/autonomy-agent/*.test.mjs tests/infrastructure/*.test.mjs > .ci-results/control.tap && npm run lint
        working-directory: candidate
      - name: Verify normal and crashed application rollback with real isolated Docker
        run: |
          node scripts/autonomy-agent/test-deployment-docker.mjs > .ci-results/rollback.log
          node scripts/autonomy-agent/test-deployment-docker.mjs --crash > .ci-results/crashed-rollback.log
        working-directory: candidate
      - run: node scripts/autonomy-agent/package-controller.mjs
        working-directory: candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-puzzoria-controller
          include-hidden-files: true
          path: |
            candidate/.release/puzzoria-controller.tar.gz
            candidate/.release/puzzoria-controller.sha256
          retention-days: 7
      - name: Publish draft PR and sanitized evidence only
        run: node ../control/scripts/release-continuity-proof.mjs
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
