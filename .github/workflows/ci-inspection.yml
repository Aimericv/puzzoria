name: Validate Windows host key reader with verified SSH
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
concurrency:
  group: puzzoria-autonomy-pilot
  cancel-in-progress: false
jobs:
  validate:
    if: vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' && vars.PUZZORIA_AUTODEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 684d86c654e9b606181b5dca7cd87d153587d4b9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: node ../control/scripts/windows-installer-review.mjs reserve
        working-directory: candidate
        env: &review-env
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_FLAG: ${{ vars.PUZZORIA_AUTODEPLOY_ENABLED }}
          FREE_FLAG: ${{ vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD }}
          AGENT_FLAG: ${{ vars.PUZZORIA_AGENT_ENABLED }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: candidate
      - run: mkdir -p .ci-results && node --test --test-isolation=none --test-reporter=tap scripts/autonomy-agent/*.test.mjs tests/infrastructure/*.test.mjs > .ci-results/control.tap && npm run lint
        working-directory: candidate
      - name: Verify PowerShell parser, no-change default and seven host key cases
        shell: pwsh
        working-directory: candidate
        run: |
          & ./scripts/autonomy-agent/test-windows-host-key.ps1
          & ./deploy/setup-release-from-windows.ps1
      - run: node scripts/autonomy-agent/package-controller.mjs
        working-directory: candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-puzzoria-controller
          include-hidden-files: true
          path: |
            candidate/.release/puzzoria-controller.tar.gz
            candidate/.release/puzzoria-controller.sha256
          retention-days: 7
      - run: node ../control/scripts/windows-installer-review.mjs publish
        working-directory: candidate
        env: *review-env
