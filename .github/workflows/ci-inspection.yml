name: Prepare readable review of the tested runner maintenance only
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
jobs:
  describe:
    if: vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: node scripts/prepare-runner-review-summary.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
