name: Full review of autonomous releases without activation
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
jobs:
  validate:
    if: vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 8b8d23691427c4ba78e4fabbc2de45cfb6987fd9
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - name: Read-only funding and bounded validation admission; create draft PR
        run: node ../control/scripts/prepare-reviewed-growth-ci.mjs
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: candidate
      - name: Verify supervisor financial, queue and deployment gates
        run: node --test --test-isolation=none --test-reporter=tap scripts/autonomy-agent/*.test.mjs tests/infrastructure/*.test.mjs > .ci-results/control.tap
        working-directory: candidate
      - name: Parse Windows bootstrap and exercise its no-change default
        shell: pwsh
        working-directory: candidate
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'deploy/setup-release-from-windows.ps1'), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { $parseErrors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          & ./deploy/setup-release-from-windows.ps1
      - name: Validate exact source with complete isolated app and four browser suites
        run: sudo --preserve-env=PATH "$(command -v node)" scripts/autonomy-agent/check-growth-ci.mjs
        working-directory: candidate
      - name: Package the validated disabled production controller
        run: node scripts/autonomy-agent/package-controller.mjs
        working-directory: candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-puzzoria-controller
          include-hidden-files: true
          path: |
            candidate/.release/puzzoria-controller.tar.gz
            candidate/.release/puzzoria-controller.sha256
          retention-days: 7
      - name: Publish filtered proof and PR status only
        if: always()
        run: node ../control/scripts/publish-reviewed-growth-ci.mjs
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
