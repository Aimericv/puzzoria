name: Observe the first growth wake without production
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: node scripts/observe-growth.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_FLAG: ${{ vars.PUZZORIA_AGENT_ENABLED }}
          CONDITIONAL_PROOF_BRANCH: codex/ci-conditional-final/39831867798
