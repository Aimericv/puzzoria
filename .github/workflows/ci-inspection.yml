name: Stage verified restricted transport under existing first activation consent
on:
  push:
    branches: [codex/ci-inspection]
permissions: {}
concurrency:
  group: puzzoria-autonomy-pilot
  cancel-in-progress: false
jobs:
  stage:
    if: vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' && vars.PUZZORIA_AUTODEPLOY_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 15451511cccdeb573cf224d6082818d39336764b
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: candidate
      - run: node ../control/scripts/stage-restricted-release.mjs
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCTION_FLAG: ${{ vars.PUZZORIA_AUTODEPLOY_ENABLED }}
          AGENT_FLAG: ${{ vars.PUZZORIA_AGENT_ENABLED }}
          FREE_FLAG: ${{ vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD }}
