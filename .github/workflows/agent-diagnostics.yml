name: One-off agent startup diagnostics
on:
  push:
    branches: [codex/autonomy-agent]
permissions: {}
jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[agent-diagnostics]')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Read startup status without Plus credentials or model execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AGENT_SOURCE_SHA: d55a0111ac4751dc17dc8d04552fec3c0a9e37d3
        run: node scripts/autonomy-agent/diagnose.mjs
