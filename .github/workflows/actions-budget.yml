name: Puzzoria monthly Actions budget and recovery
on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  reset:
    if: github.ref == 'refs/heads/main' && vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' && (github.event_name == 'schedule' || github.actor_id == '103512403')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: puzzoria-actions-budget
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - name: Verify monthly accounting and rollover before reopening compute
        run: node --test scripts/autonomy-agent/actions-budget.test.mjs
      - name: Reconcile this UTC month and enable only guarded workflows
        run: node scripts/autonomy-agent/actions-budget-run.mjs reset
        env:
          GITHUB_TOKEN: ${{ github.token }}
