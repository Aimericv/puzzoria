name: Puzzoria autonomous development

on:
  schedule:
    - cron: '17 */6 * * *'
  issue_comment:
    types: [created]
  workflow_dispatch:
  push:
    branches: [codex/autonomy-agent]

permissions: {}
concurrency:
  group: puzzoria-autonomy-pilot
  cancel-in-progress: false
env:
  PUZZORIA_AGENT_ENABLED: ${{ vars.PUZZORIA_AGENT_ENABLED }}

jobs:
  first:
    # Only the operator's explicit validation commit bypasses the permanent-off switch.
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[validate-agent]')) ||
      (vars.PUZZORIA_AGENT_ENABLED == 'true' &&
       (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
         github.event.comment.user.id == github.event.repository.owner.id && github.event.comment.user.type == 'User')))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    outputs:
      admitted: ${{ steps.session.outputs.run_model }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: session
        uses: ./.github/actions/puzzoria-agent
        with:
          mode: ${{ github.event_name == 'push' && 'validation' || 'autonomous' }}
          github-token: ${{ github.token }}
          vault-key: ${{ secrets.CODEX_PILOT_VAULT_KEY }}

  second:
    needs: first
    if: github.event_name == 'push' && needs.first.result == 'success' && needs.first.outputs.admitted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/puzzoria-agent
        with:
          mode: validation
          github-token: ${{ github.token }}
          vault-key: ${{ secrets.CODEX_PILOT_VAULT_KEY }}
