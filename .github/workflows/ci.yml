name: Repository checks

on:
  pull_request:
    branches: [main, codex/autonomy-pilot]
  push:
    branches: [codex/autonomy-pilot]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    if: vars.PUZZORIA_FREE_ACTIONS_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run content:validate
      - run: npm run content:social
      - run: npm run seo:check
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com

  e2e:
    name: E2E (${{ matrix.project }})
    needs: checks
    if: vars.PUZZORIA_FREE_ACTIONS_VERIFIED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: android
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Exercise the observed Linux regressions before the full browser suite.
      - name: Verify exports, hydrated navigation and deterministic fixtures
        run: >-
          npm run test:e2e -- e2e/social-games.spec.ts e2e/site-analytics.spec.ts e2e/rare-word.spec.ts
          --grep "new SEO pages|internal analytics require|Unusual Word plays" --project=${{ matrix.project }} --reporter=line
      - run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=line
      # Never upload the disposable SQLite DB, browser state or raw traces.
