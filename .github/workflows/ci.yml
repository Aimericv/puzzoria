name: Repository checks
on:
  pull_request:
    branches: [codex/ci51-test-base, codex/ci51-test-rebased]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
permissions: {}
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  budget:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' && github.event.pull_request.head.ref == 'codex/ci51-test-fixture'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    concurrency:
      group: puzzoria-actions-budget
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: write
      pull-requests: read
    outputs:
      allowed: ${{ steps.admit.outputs.allowed }}
      scope: ${{ steps.admit.outputs.scope }}
      mode: ${{ steps.admit.outputs.mode }}
      head: ${{ steps.admit.outputs.head }}
      base: ${{ steps.admit.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - id: admit
        run: node scripts/autonomy-agent/actions-budget-run.mjs admit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUZZORIA_BUDGET_KIND: ci
  checks:
    needs: budget
    if: needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.budget.outputs.scope == 'documentation' && 3 || 12 }}
    permissions:
      contents: read
      actions: read
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/autonomy-pilot/runtime/package-lock.json
      - name: Check protected monthly admission before installing or testing
        run: node scripts/autonomy-agent/actions-budget-run.mjs assert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUZZORIA_JOB_TIMEOUT: ${{ needs.budget.outputs.scope == 'documentation' && 3 || 12 }}
      - name: Verify source and funding
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs";import {assertFunding} from "./scripts/autonomy-agent/policy.mjs";assertFunding(JSON.parse(readFileSync("agent/autonomy/control.json")))'
          git merge-base --is-ancestor "$PUZZORIA_STAGING_BASE_SHA" HEAD
        env:
          PUZZORIA_STAGING_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: needs.budget.outputs.scope != 'documentation'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: needs.budget.outputs.scope != 'documentation'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/autonomy-pilot/runtime
      - if: needs.budget.outputs.scope != 'documentation'
        run: node --test --test-isolation=none scripts/autonomy-agent/*.test.mjs tests/infrastructure/*.test.mjs
      - if: needs.budget.outputs.scope != 'documentation'
        run: npm run lint
      - if: needs.budget.outputs.scope == 'application'
        run: npm run typecheck
      - if: needs.budget.outputs.scope == 'application' && needs.budget.outputs.mode != 'development'
        run: npm test -- --maxWorkers=2 --reporter=json --outputFile=.ci-results/unit.json
      - name: Run related development tests, falling back to all unit tests when needed
        if: needs.budget.outputs.scope == 'application' && needs.budget.outputs.mode == 'development'
        run: node scripts/autonomy-agent/ci-validation.mjs development
        env:
          PUZZORIA_CI_BASE: ${{ needs.budget.outputs.base }}
      - if: needs.budget.outputs.scope == 'application'
        run: npm run content:validate
      - if: needs.budget.outputs.scope == 'application'
        run: npm run content:social
      - if: needs.budget.outputs.scope == 'application'
        run: npm run seo:check
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com
      - if: needs.budget.outputs.scope == 'application'
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com
      - name: Record the actual scope; unrun application checks are not claimed
        run: echo 'Validated scope = ${{ needs.budget.outputs.scope }}; mode = ${{ needs.budget.outputs.mode }}. Development checks never authorize merge.' >> "$GITHUB_STEP_SUMMARY"
      - if: always() && needs.budget.outputs.scope == 'application'
        run: node scripts/autonomy-agent/ci-proof.mjs summarize
        env:
          CI_PROOF_PROJECT: checks
          CI_VALIDATION_MODE: ${{ needs.budget.outputs.mode || 'final' }}
      - if: always() && needs.budget.outputs.scope == 'application'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-${{ github.run_id }}-checks
          path: .ci-results/summary.json
          retention-days: 7
  e2e:
    name: E2E (${{ matrix.project }})
    needs: [budget, checks]
    if: needs.budget.outputs.allowed == 'true' && needs.budget.outputs.scope == 'application' && needs.budget.outputs.mode != 'development'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: android
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
          cache: npm
      - name: Check protected reservation for this browser job
        run: node scripts/autonomy-agent/actions-budget-run.mjs assert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUZZORIA_BUDGET_JOB: E2E (${{ matrix.project }})
          PUZZORIA_JOB_TIMEOUT: 30
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Every assertion from the old preflight is already in this full suite.
      - run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-results/full.json
      - if: always()
        run: node scripts/autonomy-agent/ci-proof.mjs summarize
        env:
          CI_PROOF_PROJECT: ${{ matrix.project }}
          CI_VALIDATION_MODE: final
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-evidence-${{ github.run_id }}-${{ matrix.project }}
          path: .ci-results/summary.json
          retention-days: 7
  final:
    name: Final validation
    needs: [budget, checks, e2e]
    if: always() && needs.budget.outputs.allowed == 'true' && needs.budget.outputs.scope == 'application'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      # Final admission uses the trusted base policy, not the candidate's script.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - name: Check the protected reservation for the final gate
        run: node scripts/autonomy-agent/actions-budget-run.mjs assert
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUZZORIA_BUDGET_JOB: Final validation
          PUZZORIA_JOB_TIMEOUT: 2
      - name: Require final mode and all four browsers on the current head and base
        run: node scripts/autonomy-agent/ci-validation.mjs final
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUZZORIA_CI_MODE: ${{ needs.budget.outputs.mode }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-final-evidence-${{ github.run_id }}
          path: .ci-results/final.json
          if-no-files-found: error
          retention-days: 7
