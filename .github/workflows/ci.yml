name: Repository checks

on:
  pull_request:
    branches: [main, codex/autonomy-pilot]
  push:
    branches: [codex/autonomy-pilot]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/autonomy-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
      deployments: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - run: node scripts/autonomy-agent/ci-proof.mjs inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}

  checks:
    if: >-
      vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 4 &&
       github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/autonomy-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - name: Verify funding declaration and require current main as an ancestor
        run: |
          node --input-type=module -e 'import {readFileSync} from "node:fs";import {assertFunding} from "./scripts/autonomy-agent/policy.mjs";assertFunding(JSON.parse(readFileSync("agent/autonomy/control.json")))'
          git merge-base --is-ancestor origin/main HEAD
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefix scripts/autonomy-pilot/runtime
      - run: node --test scripts/autonomy-agent/*.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=2 --reporter=json --outputFile=.ci-results/unit.json
      - run: npm run content:validate
      - run: npm run content:social
      - run: npm run seo:check
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://puzzoria.com
      - name: Preserve sanitized test counts
        if: always()
        run: node scripts/autonomy-agent/ci-proof.mjs summarize
        env:
          CI_PROOF_PROJECT: checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-evidence-${{ github.run_id }}-checks
          path: .ci-results/summary.json
          retention-days: 14

  e2e:
    name: E2E (${{ matrix.project }})
    needs: checks
    if: >-
      vars.PUZZORIA_ACTIONS_NO_PAYMENT_METHOD == 'true' ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 4 &&
       github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/autonomy-agent')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: android
            browser: chromium
          - project: iphone-webkit
            browser: webkit
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Exercise the observed Linux regressions before the full browser suite.
      - name: Verify exports, hydrated navigation and deterministic fixtures
        run: >-
          npm run test:e2e -- e2e/social-games.spec.ts e2e/site-analytics.spec.ts e2e/rare-word.spec.ts
          --grep "new SEO pages|internal analytics require|Unusual Word plays" --project=${{ matrix.project }} --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-results/preflight.json
      - run: npm run test:e2e -- --project=${{ matrix.project }} --reporter=line,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-results/full.json
      - name: Preserve sanitized browser results without traces or databases
        if: always()
        run: node scripts/autonomy-agent/ci-proof.mjs summarize
        env:
          CI_PROOF_PROJECT: ${{ matrix.project }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-evidence-${{ github.run_id }}-${{ matrix.project }}
          path: .ci-results/summary.json
          retention-days: 14
      # Never upload the disposable SQLite DB, browser state or raw traces.

  evidence:
    needs: [checks, e2e]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 4 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/autonomy-agent'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      deployments: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.15.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ci-evidence-${{ github.run_id }}-*
          path: .ci-evidence
      - name: Publish validation and read-only deployment inspection
        if: always()
        run: node scripts/autonomy-agent/ci-proof.mjs publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
