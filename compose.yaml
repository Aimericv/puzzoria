name: dailygrid
services:
  app:
    image: dailygrid:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.docker}
    init: true
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.docker}
      AUTH_ORIGIN: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.docker}
      DAILYGRID_DB_PATH: /data/dailygrid.sqlite
      BACKUP_DIR: /backups
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ANALYTICS_ADMIN_USERNAMES: ${ANALYTICS_ADMIN_USERNAMES:-}
      ANALYTICS_READER_TOKEN_SHA256: ${ANALYTICS_READER_TOKEN_SHA256:-}
      COMMUNITY_STARTER_STATS: ${COMMUNITY_STARTER_STATS:-false}
      ACCOUNT_DELETION_LOG: /backups/account-deletions.jsonl
      LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
      LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
      LEGAL_PUBLISHER_COUNTRY: ${LEGAL_PUBLISHER_COUNTRY:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
      LEGAL_STORAGE_REGION: ${LEGAL_STORAGE_REGION:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3030}:3000"
    volumes:
      - game_data:/data
      - game_backups:/backups
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  operations:
    image: dailygrid:${IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    command: ["node", "scripts/operations.mjs"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      DAILYGRID_DB_PATH: /data/dailygrid.sqlite
      BACKUP_DIR: /backups
      OPERATIONS_HEALTH_URL: http://app:3000/api/health
      OPERATIONS_WEBHOOK_URL: ${OPERATIONS_WEBHOOK_URL:-}
    volumes:
      - game_data:/data
      - game_backups:/backups
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "const s=JSON.parse(require('fs').readFileSync('/backups/operations-state.json'));process.exit(Date.now()-s.checkedAt<180000?0:1)"]
      interval: 60s
      timeout: 5s
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  game_data:
  game_backups:
