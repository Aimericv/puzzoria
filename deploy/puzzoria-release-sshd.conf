# Independent deployment listener. Do not include the administrative sshd configuration.
Port 2222
AddressFamily inet
ListenAddress 0.0.0.0
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/puzzoria-release-sshd.pid
PermitRootLogin no
AllowUsers puzzoria-release
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM yes
StrictModes yes
AuthorizedKeysFile .ssh/authorized_keys
ForceCommand /usr/local/bin/puzzoria-release-entry
PermitTTY no
DisableForwarding yes
AllowTcpForwarding no
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no
MaxAuthTries 3
LoginGraceTime 20
MaxStartups 10:30:30
LogLevel INFO
